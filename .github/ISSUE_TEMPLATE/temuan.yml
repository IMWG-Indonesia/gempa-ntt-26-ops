name: Temuan
description: Sesuatu yang ditemukan dan perlu dicatat, tapi belum diputuskan jadi pekerjaan
type: Finding
title: "[Temuan] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Gunakan ini untuk mencatat hal yang muncul di luar tugas yang sedang dikerjakan:
        sumber data baru, angka yang tidak cocok antar sumber, formulir yang ternyata sudah ditutup,
        wilayah yang tidak muncul di data mana pun.

        **Catat dulu, triase belakangan.** Tidak perlu tahu solusinya untuk membuat tugas ini.

  - type: textarea
    id: temuan
    attributes:
      label: Apa yang ditemukan
      description: Tulis apa yang terlihat, bukan dugaan penyebabnya.
      placeholder: |
        Jumlah pengungsi untuk satu kabupaten berbeda antara dasbor resmi dan
        rekapitulasi lapangan, selisihnya sekitar sepertiga.
    validations:
      required: true

  - type: textarea
    id: bukti
    attributes:
      label: Dari mana
      description: Tautan, tangkapan layar, nama berkas, atau tanggal dan sumber percakapan.
    validations:
      required: true

  - type: textarea
    id: dampak
    attributes:
      label: Kenapa ini perlu diperhatikan
      description: Apa yang bisa keliru kalau temuan ini dibiarkan. Kalau belum tahu, tulis `belum diketahui`.
      placeholder: |
        Angka ini dipakai di laporan situasi terakhir, sehingga perencanaan
        distribusi kemungkinan memakai dasar yang salah.
    validations:
      required: true

  - type: dropdown
    id: usulan
    attributes:
      label: Usulan tindak lanjut
      options:
        - Perlu dibuatkan tugas tersendiri
        - Cukup dicatat sebagai konteks
        - Perlu ditanyakan ke pemilik data
        - Belum tahu, minta pendapat
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ---
        Tugas temuan tidak perlu tenggat. Yang perlu dilengkapi hanya label
        `bidang:` dan `wilayah:`.
