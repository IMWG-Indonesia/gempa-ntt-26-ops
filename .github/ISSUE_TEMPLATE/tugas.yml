name: Tugas IM
description: Permintaan produk informasi yang sudah jelas keluarannya
type: Task
title: "[Sebutkan produknya secara ringkas]"
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Satu tugas = satu kebutuhan = satu keluaran. Kalau kebutuhannya besar, pecah jadi beberapa tugas.

        **Prioritas dan tenggat tidak diisi di sini.** Keduanya diatur di panel kanan setelah tugas dibuat, supaya bisa disortir dan difilter.

  - type: textarea
    id: pekerjaan
    attributes:
      label: Pekerjaan
      description: Satu kalimat, apa yang dikerjakan.
      placeholder: Peta gabungan guncangan gempa dengan batas kabupaten serta titik pelabuhan dan bandara terdekat.
    validations:
      required: true

  - type: textarea
    id: tujuan
    attributes:
      label: Tujuan
      description: Masalah konkret apa yang sedang ditutup, dan keputusan apa yang mau dibantu. Bukan manfaat umum.
      placeholder: |
        Rapat koordinasi antar-lembaga belum punya gambaran akses masuk logistik,
        sehingga prioritas wilayah masih ditentukan berdasarkan perkiraan.
    validations:
      required: true

  - type: textarea
    id: hasil
    attributes:
      label: Hasil
      description: Daftar keluaran yang bisa diperiksa. Sedetail mungkin. Sebutkan apa yang harus terlihat atau terjawab di dalamnya.
      placeholder: |
        - Sebaran tingkat guncangan terhadap batas kabupaten/kota
        - Nama kabupaten/kota yang berada pada guncangan kuat
        - Titik pelabuhan dan bandara terdekat beserta namanya
        - Legenda, arah utara, skala, sumber data, tanggal data
    validations:
      required: true

  - type: textarea
    id: selesai-bila
    attributes:
      label: Selesai bila
      description: |
        Kriteria yang bisa dicek sendiri oleh pengerja tanpa bertanya balik ke pemohon.
        Kriteria terbaik memaksa pemeriksaan oleh orang lain.
      placeholder: |
        - Setiap angka pada peta bisa ditelusuri ke sumbernya oleh orang yang tidak membuatnya
        - Satu orang di luar pembuat sudah membaca peta dan bisa menyebutkan tiga kabupaten prioritas tanpa penjelasan lisan
    validations:
      required: true

  - type: textarea
    id: format
    attributes:
      label: Format dan tempat simpan
      description: Wujud berkasnya, dan di folder mana hasilnya diunggah.
      placeholder: |
        PNG dan PDF ukuran A3, diunggah ke folder kerja bersama /produk/peta/
    validations:
      required: true

  - type: textarea
    id: sumber-data
    attributes:
      label: Sumber data
      description: |
        Tautan atau nama berkas. Kalau datanya belum ada, tulis `belum tersedia`,
        jangan dikosongkan, supaya terbaca sebagai bagian dari pekerjaan.
      placeholder: |
        - Guncangan: (tautan)
        - Batas administrasi: (tautan folder kerja bersama)
        - Titik pelabuhan dan bandara: belum tersedia
    validations:
      required: true

  - type: input
    id: diminta-oleh
    attributes:
      label: Diminta oleh
      description: Nama orang atau unit yang membutuhkan. Bukan nama yang mengerjakan.
      placeholder: Sekretariat IHCP
    validations:
      required: true

  - type: checkboxes
    id: tata-kelola
    attributes:
      label: Tata kelola data
      description: Dicentang oleh pengerja sebelum tugas dipindah ke Review.
      options:
        - label: Sumber data dicantumkan pada produk
        - label: Tanggal data (as-of) dicantumkan
        - label: Tingkat keyakinan disebutkan untuk bagian yang belum terverifikasi
        - label: Tidak memuat data pribadi pada keluaran yang beredar luas
        - label: Berkas hasil sudah diunggah, tautannya ditempel di komentar

  - type: markdown
    attributes:
      value: |
        ---
        Setelah tugas dibuat, mohon lengkapi **Target date** di panel kanan, yaitu tanggal
        produk ini dibutuhkan.

        Perkiraan jam kerja, tingkat prioritas, dan label akan dilengkapi oleh petugas piket
        saat menyisir Permintaan Masuk. Tidak perlu Anda isi sendiri.
